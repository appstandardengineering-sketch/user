<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layout Data Capture</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 12px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; padding: 10px; background: #fff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,.1); }
  button, .btn { padding: 10px 14px; background: #2f75b5; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
  button:hover, .btn:hover { background: #1e4e79; }
  button:disabled { opacity: .6; cursor: wait; }
  .btn input { display: none; }
  #viewer { overflow: auto; max-height: 75vh; border: 1px solid #ccc; background: #fff; }
  #stage { position: relative; width: 100%; }
  #zoombar { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  #zoombar button { min-width: 44px; font-size: 18px; }
  #bg { display: none; width: 100%; height: auto; }
  #stage .canvas-container { position: absolute !important; left: 0; top: 0; }
  canvas { background: transparent; }
  #status { font-size: 13px; margin: 6px 0; color: #333; }
  .modal { display: none; position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(92vw, 360px); max-height: 90vh; overflow: auto; box-sizing: border-box; background: #fff; padding: 15px; border: 1px solid #333; box-shadow: 0 4px 16px rgba(0,0,0,.35); z-index: 10; border-radius: 8px; }
  .modal label { display: block; font-size: 13px; margin-top: 6px; }
  .modal input, .modal select { width: 100%; box-sizing: border-box; padding: 8px; margin: 3px 0 8px; font-size: 16px; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; margin-top: 16px; background: #fff; font-size: 14px; }
  th, td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; white-space: nowrap; }
</style>
</head>
<body>

<div class="controls">
  <label class="btn">📷 Take photo<input type="file" id="camLoader" accept="image/*" capture="environment"></label>
  <label class="btn">🖼️ Choose file<input type="file" id="fileLoader" accept="image/*"></label>
  <button onclick="undoLast()" style="background:#6c757d">↩ Undo last</button>
  <button onclick="downloadExcel()">📥 Download Excel</button>
  <button id="syncBtn" onclick="syncSheets()" style="background:#28a745">🚀 Sync to Google Sheets</button>
</div>

<div id="status">v7 · No image loaded yet</div>
<div id="zoombar">
  <button onclick="zoomBy(-0.5)">−</button>
  <span id="zoomLabel">100%</span>
  <button onclick="zoomBy(0.5)">+</button>
  <button onclick="if (baseW) applyZoom(1)" style="background:#6c757d">Fit</button>
</div>
<div id="viewer"><div id="stage"><img id="bg" alt=""><canvas id="layoutCanvas" width="800" height="600"></canvas></div></div>

<div id="dataModal" class="modal">
  <h3 style="margin-top:0">Panel Details</h3>
  <label>Type</label>
  <select id="entryType">
    <option value="Main">Main Panel</option>
    <option value="Add">Addition (+)</option>
    <option value="Ded">Deduction (-)</option>
  </select>
  <label>Description (Panel/Window/Patta)</label>
  <input type="text" id="desc">
  <div class="row">
    <div><label>Length</label><input type="number" step="0.01" id="length" inputmode="decimal"></div>
    <div><label>Height</label><input type="number" step="0.01" id="height" inputmode="decimal"></div>
  </div>
  <label>Category</label>
  <select id="category">
    <option value="Standard">Standard</option>
    <option value="Duct Wall">Duct Wall</option>
    <option value="Dead Wall">Dead Wall</option>
  </select>
  <button onclick="saveData()">Save Tag</button>
  <button onclick="closeModal()" style="background:#dc3545">Cancel</button>
</div>

<div class="scroll">
<table>
  <thead><tr><th>ID</th><th>Type</th><th>Desc</th><th>L</th><th>H</th><th>Category</th><th>Total</th><th>Synced</th></tr></thead>
  <tbody id="tableBody"></tbody>
  <tfoot><tr><th colspan="6" style="text-align:right">Net total</th><th id="netTotal">0.00</th><th></th></tr></tfoot>
</table>
</div>

<script>
  // Your Cloudflare Worker URL
  const WORKER_URL = "https://patient-truth-615b.app-standardengineering.workers.dev/";

  const $ = id => document.getElementById(id);
  const canvas = new fabric.Canvas('layoutCanvas', { selection: false, allowTouchScrolling: true, enableRetinaScaling: false });
  const records = [];
  const tags = {};
  const synced = new Set();
  let counter = 1;
  let point = null;

  // The photo is shown in a plain <img>; the fabric canvas sits transparently on top for tags
  canvas.wrapperEl.style.display = 'none'; // hidden until an image is loaded
  let currentUrl = null;
  function setStatus(t) { $('status').textContent = 'v7 · ' + t; }

  // Image loading (camera + file share one handler)
  function loadInto(bg, url) {
    return new Promise((resolve, reject) => {
      bg.onload = () => resolve();
      bg.onerror = () => reject(new Error('decode failed'));
      bg.src = url;
    });
  }

  async function loadImage(e) {
    const input = e.target;
    const file = input.files && input.files[0];
    if (!file) { setStatus('The picker did not return a file'); return; }
    const info = file.name + ' (' + Math.round(file.size / 1024) + ' KB, ' + (file.type || 'unknown type') + ')';
    setStatus('Reading ' + info + '…');

    // Copy the bytes right away; some Android pickers make the file unreadable later
    let blob = file, readErr = '';
    try {
      blob = new Blob([await file.arrayBuffer()], { type: file.type || 'image/jpeg' });
      input.value = '';
    } catch (err) {
      readErr = err.name; // keep the original file and try to display it directly
    }

    const bg = $('bg');
    if (currentUrl) URL.revokeObjectURL(currentUrl);
    currentUrl = URL.createObjectURL(blob);
    try {
      await loadInto(bg, currentUrl);
    } catch (_) {
      try {
        // Fallback: decode manually and shrink (very large photos, unusual encodings)
        const bmp = await createImageBitmap(blob);
        const k = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
        const off = document.createElement('canvas');
        off.width = Math.round(bmp.width * k);
        off.height = Math.round(bmp.height * k);
        off.getContext('2d').drawImage(bmp, 0, 0, off.width, off.height);
        const out = await new Promise(r => off.toBlob(r, 'image/jpeg', 0.9));
        URL.revokeObjectURL(currentUrl);
        currentUrl = URL.createObjectURL(out);
        await loadInto(bg, currentUrl);
      } catch (err) {
        setStatus('Cannot open ' + info + ' — ' + (readErr || (err && err.name) || 'error'));
        alert('Your phone would not let the browser read this file. Pick it from the Files app (Downloads or Images) instead, or use Take photo.');
        input.value = '';
        return;
      }
    }

    bg.style.display = 'block';
    zoom = 1;
    baseW = Math.min($('viewer').clientWidth, 1000);
    $('stage').style.width = baseW + 'px';
    baseH = bg.clientHeight;
    $('viewer').scrollLeft = 0;
    $('viewer').scrollTop = 0;
    canvas.wrapperEl.style.display = 'block';
    applyZoom(1);
    input.value = '';
    setStatus('Image loaded (' + bg.naturalWidth + '×' + bg.naturalHeight + '). Tap to tag, drag to move, pinch or use +/− to zoom.');
  }
  $('camLoader').addEventListener('change', loadImage);
  $('fileLoader').addEventListener('change', loadImage);

  // Zoom: the stage gets wider and the canvas follows; the viewer scrolls to pan
  let zoom = 1, baseW = 0, baseH = 0;
  const MAX_ZOOM = 4;
  function applyZoom(z) {
    const v = $('viewer');
    const cx = (v.scrollLeft + v.clientWidth / 2) / zoom; // keep the middle of the view in place
    const cy = (v.scrollTop + v.clientHeight / 2) / zoom;
    zoom = Math.min(MAX_ZOOM, Math.max(1, z));
    $('stage').style.width = (baseW * zoom) + 'px';
    canvas.setDimensions({ width: baseW * zoom, height: baseH * zoom });
    canvas.setZoom(zoom);
    v.scrollLeft = cx * zoom - v.clientWidth / 2;
    v.scrollTop = cy * zoom - v.clientHeight / 2;
    $('zoomLabel').textContent = Math.round(zoom * 100) + '%';
  }
  function zoomBy(d) { if (baseW) applyZoom(zoom + d); }

  // Gestures handled here: tap = open form, one-finger drag = pan, two-finger pinch = zoom
  const up = canvas.upperCanvasEl;
  up.style.touchAction = canvas.wrapperEl.style.touchAction = 'none'; // we do the panning ourselves
  const ptrs = new Map();
  let tap = null, last = null, pinch0 = null, raf = 0, nextZ = 1;
  const dist = () => { const [a, b] = [...ptrs.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
  const queueZoom = z => { // at most one resize per frame while pinching
    nextZ = z;
    if (!raf) raf = requestAnimationFrame(() => { raf = 0; applyZoom(nextZ); });
  };

  up.addEventListener('pointerdown', e => {
    try { up.setPointerCapture(e.pointerId); } catch (_) {}
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 1) {
      tap = { x: e.clientX, y: e.clientY, t: Date.now() };
      last = { x: e.clientX, y: e.clientY };
    } else {
      tap = null;
      pinch0 = { d: dist() || 1, z: zoom };
    }
  });

  up.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 2 && pinch0) {
      queueZoom(pinch0.z * dist() / pinch0.d);
    } else if (ptrs.size === 1 && last) {
      if (tap && Math.hypot(e.clientX - tap.x, e.clientY - tap.y) > 10) tap = null; // it is a drag now
      if (!tap) {
        const v = $('viewer');
        v.scrollLeft -= e.clientX - last.x;
        v.scrollTop -= e.clientY - last.y;
      }
      last = { x: e.clientX, y: e.clientY };
    }
  });

  const endPointer = e => {
    if (!ptrs.has(e.pointerId)) return;
    const wasTap = tap && e.type === 'pointerup' && ptrs.size === 1 && Date.now() - tap.t < 700;
    ptrs.delete(e.pointerId);
    if (ptrs.size < 2) pinch0 = null;
    if (ptrs.size === 1) { // one finger left after a pinch: carry on as a pan, no form
      const p = [...ptrs.values()][0];
      last = { x: p.x, y: p.y };
      tap = null;
    }
    if (wasTap) {
      const r = up.getBoundingClientRect();
      point = { x: (e.clientX - r.left) / zoom, y: (e.clientY - r.top) / zoom };
      $('dataModal').style.display = 'block';
    }
    if (ptrs.size === 0) { tap = null; last = null; }
  };
  up.addEventListener('pointerup', endPointer);
  up.addEventListener('pointercancel', endPointer);

  function closeModal() { $('dataModal').style.display = 'none'; }

  function saveData() {
    const desc = $('desc').value.trim();
    if (!desc) return alert('Please enter a description.');
    const type = $('entryType').value;
    const length = parseFloat($('length').value) || 0;
    const height = parseFloat($('height').value) || 0;
    const category = $('category').value;
    const isDed = type === 'Ded';
    let qty = length * height;
    if (isDed) qty = -Math.abs(qty);

    const id = 'P' + counter++;
    records.push({
      panelId: id, type, description: desc, count: isDed ? -1 : 1,
      length, height, category, quantity: Math.round(qty * 100) / 100
    });

    const color = category === 'Duct Wall' ? 'green' : category === 'Dead Wall' ? 'blue' : 'red';
    const k = 1 / zoom; // pin and label keep the same size on screen at any zoom
    const dot = new fabric.Circle({
      left: point.x, top: point.y, radius: 5 * k, fill: color, stroke: 'white', strokeWidth: 1.5 * k,
      originX: 'center', originY: 'center', selectable: false, evented: false
    });
    const label = new fabric.Text(`[${id}] ${desc}\nL:${length} H:${height}`, {
      left: point.x + 8 * k, top: point.y + 8 * k, fontSize: 13 * k,
      fill: 'white', backgroundColor: color, selectable: false, evented: false
    });
    tags[id] = [dot, label];
    canvas.add(dot, label);

    ['desc', 'length', 'height'].forEach(k => $(k).value = '');
    closeModal();
    updateTable();
  }

  function undoLast() {
    const last = records[records.length - 1];
    if (!last) return;
    if (synced.has(last.panelId)) return alert('That row is already in Google Sheets, so it cannot be undone here.');
    records.pop();
    tags[last.panelId].forEach(o => canvas.remove(o));
    delete tags[last.panelId];
    counter--;
    updateTable();
  }

  function updateTable() {
    const tbody = $('tableBody');
    tbody.innerHTML = '';
    let total = 0;
    records.forEach(r => {
      total += r.quantity;
      const tr = document.createElement('tr');
      [r.panelId, r.type, r.description, r.length, r.height, r.category, r.quantity.toFixed(2),
       synced.has(r.panelId) ? '✓' : ''].forEach(v => {
        const td = document.createElement('td');
        td.textContent = v; // textContent avoids HTML injection
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    $('netTotal').textContent = total.toFixed(2);
  }

  function downloadExcel() {
    if (!records.length) return alert('No data to export!');
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(records), 'LayoutData');
    XLSX.writeFile(wb, 'Layout_Measurements.xlsx');
  }

  async function syncSheets() {
    const pending = records.filter(r => !synced.has(r.panelId)); // never send the same row twice
    if (!pending.length) return alert('Nothing new to sync.');
    const btn = $('syncBtn');
    btn.disabled = true; btn.textContent = 'Syncing…';
    try {
      // text/plain avoids a CORS preflight; the Worker still parses it as JSON
      const res = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(pending)
      });
      const text = await res.text();
      let out;
      try { out = JSON.parse(text); }
      catch { throw new Error('Unexpected reply: ' + text.slice(0, 120)); }
      if (out.status === 'success') {
        pending.forEach(r => synced.add(r.panelId));
        updateTable();
        alert('Synced ' + pending.length + ' row(s) to Google Sheets.');
      } else {
        alert('Server error: ' + (out.message || out.error || 'unknown'));
      }
    } catch (err) {
      alert('Sync failed: ' + err.message);
    } finally {
      btn.disabled = false; btn.textContent = '🚀 Sync to Google Sheets';
    }
  }
</script>
</body>
</html>
