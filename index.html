<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layout Data Capture</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 12px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; padding: 10px; background: #fff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,.1); }
  button, .btn { padding: 10px 14px; background: #2f75b5; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
  button:hover, .btn:hover { background: #1e4e79; }
  button:disabled { opacity: .6; cursor: wait; }
  .btn input { display: none; }
  #stage { width: 100%; max-width: 1200px; }
  canvas { border: 1px solid #ccc; background: #fff; }
  .modal { display: none; position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(92vw, 360px); max-height: 90vh; overflow: auto; box-sizing: border-box; background: #fff; padding: 15px; border: 1px solid #333; box-shadow: 0 4px 16px rgba(0,0,0,.35); z-index: 10; border-radius: 8px; }
  .modal label { display: block; font-size: 13px; margin-top: 6px; }
  .modal input, .modal select { width: 100%; box-sizing: border-box; padding: 8px; margin: 3px 0 8px; font-size: 16px; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; margin-top: 16px; background: #fff; font-size: 14px; }
  th, td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; white-space: nowrap; }
</style>
</head>
<body>

<div class="controls">
  <label class="btn">📷 Take photo<input type="file" id="camLoader" accept="image/*" capture="environment"></label>
  <label class="btn">🖼️ Choose file<input type="file" id="fileLoader" accept="image/*"></label>
  <button onclick="undoLast()" style="background:#6c757d">↩ Undo last</button>
  <button onclick="downloadExcel()">📥 Download Excel</button>
  <button id="syncBtn" onclick="syncSheets()" style="background:#28a745">🚀 Sync to Google Sheets</button>
</div>

<div id="stage"><canvas id="layoutCanvas" width="800" height="600"></canvas></div>

<div id="dataModal" class="modal">
  <h3 style="margin-top:0">Panel Details</h3>
  <label>Type</label>
  <select id="entryType">
    <option value="Main">Main Panel</option>
    <option value="Add">Addition (+)</option>
    <option value="Ded">Deduction (-)</option>
  </select>
  <label>Description (Panel/Window/Patta)</label>
  <input type="text" id="desc">
  <div class="row">
    <div><label>Length</label><input type="number" step="0.01" id="length" inputmode="decimal"></div>
    <div><label>Height</label><input type="number" step="0.01" id="height" inputmode="decimal"></div>
  </div>
  <label>Category</label>
  <select id="category">
    <option value="Standard">Standard</option>
    <option value="Duct Wall">Duct Wall</option>
    <option value="Dead Wall">Dead Wall</option>
  </select>
  <button onclick="saveData()">Save Tag</button>
  <button onclick="closeModal()" style="background:#dc3545">Cancel</button>
</div>

<div class="scroll">
<table>
  <thead><tr><th>ID</th><th>Type</th><th>Desc</th><th>L</th><th>H</th><th>Category</th><th>Total</th><th>Synced</th></tr></thead>
  <tbody id="tableBody"></tbody>
  <tfoot><tr><th colspan="6" style="text-align:right">Net total</th><th id="netTotal">0.00</th><th></th></tr></tfoot>
</table>
</div>

<script>
  // Your Cloudflare Worker URL
  const WORKER_URL = "https://patient-truth-615b.app-standardengineering.workers.dev/";

  const $ = id => document.getElementById(id);
  const canvas = new fabric.Canvas('layoutCanvas', { selection: false });
  const records = [];
  const tags = {};
  const synced = new Set();
  let counter = 1;
  let point = null;

  // Image loading (camera + file share one handler)
  function loadImage(e) {
  const input = e.target;
  const file = input.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  const im = new Image();
  im.onload = () => {
    // shrink big phone photos so the browser can handle them
    const MAX = 1600;
    const k = Math.min(1, MAX / Math.max(im.naturalWidth, im.naturalHeight));
    const off = document.createElement('canvas');
    off.width = Math.round(im.naturalWidth * k);
    off.height = Math.round(im.naturalHeight * k);
    off.getContext('2d').drawImage(im, 0, 0, off.width, off.height);
    URL.revokeObjectURL(url);
    fabric.Image.fromURL(off.toDataURL('image/jpeg', 0.85), img => {
      const w = Math.min($('stage').clientWidth || 800, 1200);
      const s = w / img.width;
      canvas.setDimensions({ width: w, height: Math.round(img.height * s) });
      canvas.setBackgroundImage(img, canvas.renderAll.bind(canvas), { scaleX: s, scaleY: s });
      input.value = ''; // clear only after the image is loaded
    });
  };
  im.onerror = () => {
    URL.revokeObjectURL(url);
    alert('Could not open this image. If it is HEIC/HEIF, pick a JPEG or PNG, or use Take photo.');
    input.value = '';
  };
  im.src = url;
}
  $('camLoader').addEventListener('change', loadImage);
  $('fileLoader').addEventListener('change', loadImage);

  // Tap/click on the canvas opens the form (works for mouse and touch)
  canvas.on('mouse:down', o => {
    point = canvas.getPointer(o.e);
    $('dataModal').style.display = 'block';
  });

  function closeModal() { $('dataModal').style.display = 'none'; }

  function saveData() {
    const desc = $('desc').value.trim();
    if (!desc) return alert('Please enter a description.');
    const type = $('entryType').value;
    const length = parseFloat($('length').value) || 0;
    const height = parseFloat($('height').value) || 0;
    const category = $('category').value;
    const isDed = type === 'Ded';
    let qty = length * height;
    if (isDed) qty = -Math.abs(qty);

    const id = 'P' + counter++;
    records.push({
      panelId: id, type, description: desc, count: isDed ? -1 : 1,
      length, height, category, quantity: Math.round(qty * 100) / 100
    });

    const color = category === 'Duct Wall' ? 'green' : category === 'Dead Wall' ? 'blue' : 'red';
    const tag = new fabric.Text(`[${id}] ${desc}\nL:${length} H:${height}`, {
      left: point.x, top: point.y, fontSize: Math.max(11, Math.round(canvas.width / 55)),
      fill: 'white', backgroundColor: color, padding: 5, selectable: false, evented: false
    });
    tags[id] = tag;
    canvas.add(tag);

    ['desc', 'length', 'height'].forEach(k => $(k).value = '');
    closeModal();
    updateTable();
  }

  function undoLast() {
    const last = records[records.length - 1];
    if (!last) return;
    if (synced.has(last.panelId)) return alert('That row is already in Google Sheets, so it cannot be undone here.');
    records.pop();
    canvas.remove(tags[last.panelId]);
    delete tags[last.panelId];
    counter--;
    updateTable();
  }

  function updateTable() {
    const tbody = $('tableBody');
    tbody.innerHTML = '';
    let total = 0;
    records.forEach(r => {
      total += r.quantity;
      const tr = document.createElement('tr');
      [r.panelId, r.type, r.description, r.length, r.height, r.category, r.quantity.toFixed(2),
       synced.has(r.panelId) ? '✓' : ''].forEach(v => {
        const td = document.createElement('td');
        td.textContent = v; // textContent avoids HTML injection
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    $('netTotal').textContent = total.toFixed(2);
  }

  function downloadExcel() {
    if (!records.length) return alert('No data to export!');
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(records), 'LayoutData');
    XLSX.writeFile(wb, 'Layout_Measurements.xlsx');
  }

  async function syncSheets() {
    const pending = records.filter(r => !synced.has(r.panelId)); // never send the same row twice
    if (!pending.length) return alert('Nothing new to sync.');
    const btn = $('syncBtn');
    btn.disabled = true; btn.textContent = 'Syncing…';
    try {
      // text/plain avoids a CORS preflight; the Worker still parses it as JSON
      const res = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(pending)
      });
      const text = await res.text();
      let out;
      try { out = JSON.parse(text); }
      catch { throw new Error('Unexpected reply: ' + text.slice(0, 120)); }
      if (out.status === 'success') {
        pending.forEach(r => synced.add(r.panelId));
        updateTable();
        alert('Synced ' + pending.length + ' row(s) to Google Sheets.');
      } else {
        alert('Server error: ' + (out.message || out.error || 'unknown'));
      }
    } catch (err) {
      alert('Sync failed: ' + err.message);
    } finally {
      btn.disabled = false; btn.textContent = '🚀 Sync to Google Sheets';
    }
  }
</script>
</body>
</html>
